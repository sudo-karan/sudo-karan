name: Generate contribution snake

# Builds the animated "snake" that eats the contribution graph and publishes
# the SVGs to the `output` branch, where the README references them from.
# Runs on every push to the default branch, twice a day, and on demand.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f4cff&color_dots=#e6e2d6,#c9d2f2,#89a0ef,#4a6cf0,#1f4cff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1f4cff&color_dots=#161b22,#1e2a52,#2f45a0,#3f6bf0,#5a7cff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
