<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Jaskaran Singh — Deputy Director at India's National Informatics Centre, building data.gov.in; part-time PhD at IIT Delhi on forest monitoring from satellite imagery.">
  <defs>
    <style>
      .mono { font-family: 'Courier New', 'DejaVu Sans Mono', monospace; }
      .sans { font-family: 'Arial Black', 'Arial Narrow', Arial, 'Helvetica Neue', sans-serif; }
    </style>
  </defs>

  <!-- paper + heavy brutalist frame -->
  <rect x="0" y="0" width="1200" height="540" fill="#f2f0ea"/>
  <rect x="5" y="5" width="1190" height="530" fill="none" stroke="#111111" stroke-width="6"/>

  <!-- top meta rail -->
  <line x1="5" y1="92" x2="1195" y2="92" stroke="#111111" stroke-width="2"/>
  <text class="mono" x="34" y="44" font-size="13" letter-spacing="1.5" fill="#111111"><tspan fill="#6f6b62">LOC /</tspan>  NEW DELHI, IN · UTC+05:30</text>
  <text class="mono" x="34" y="72" font-size="13" letter-spacing="1.5" fill="#111111"><tspan fill="#6f6b62">ROLE /</tspan>  DEPUTY DIRECTOR · NIC · MeitY</text>
  <rect x="946" y="33" width="11" height="11" fill="#1f4cff"/>
  <text class="mono" x="966" y="44" font-size="13" letter-spacing="1.5" fill="#1f4cff">OPEN TO RESEARCH COLLAB
    <animate attributeName="opacity" values="1;1;0.3;1" keyTimes="0;0.55;0.75;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <text class="mono" x="1166" y="72" font-size="13" letter-spacing="1.5" fill="#111111" text-anchor="end"><tspan fill="#6f6b62">UPDATED /</tspan>  OCT 2026</text>

  <!-- giant nameplate -->
  <text class="sans" x="30" y="236" font-size="134" letter-spacing="-4" fill="#111111">JASKARAN</text>
  <text class="sans" x="30" y="356" font-size="134" letter-spacing="-4" fill="#111111">SINGH<tspan fill="#1f4cff">.</tspan></text>

  <!-- cobalt rule block -->
  <rect x="34" y="378" width="440" height="11" fill="#1f4cff"/>

  <!-- headline band, full width, monospace -->
  <text class="mono" x="34" y="424" font-size="16" letter-spacing="0.2" fill="#111111">
    <tspan x="34" dy="0">Deputy Director at India's National Informatics Centre. I lead the team that</tspan>
    <tspan x="34" dy="25">builds data.gov.in, India's national open-data platform. Part-time PhD at IIT</tspan>
    <tspan x="34" dy="25">Delhi on monitoring forest biodiversity from Sentinel satellite imagery.</tspan>
  </text>

  <!-- handle strip -->
  <g>
    <line x1="5" y1="488" x2="1195" y2="488" stroke="#111111" stroke-width="2"/>
    <rect x="5" y="488" width="210" height="47" fill="#111111"/>
    <text class="mono" x="110" y="517" font-size="13" letter-spacing="1" fill="#f2f0ea" text-anchor="middle" font-weight="bold">@sudo-karan</text>
    <line x1="215" y1="488" x2="215" y2="535" stroke="#111111" stroke-width="2"/>
    <text class="mono" x="245" y="517" font-size="12.5" letter-spacing="1.5" fill="#111111">SCIENTIST-C · MeitY</text>
    <line x1="490" y1="488" x2="490" y2="535" stroke="#111111" stroke-width="2"/>
    <text class="mono" x="520" y="517" font-size="12.5" letter-spacing="1.5" fill="#111111">PhD · IIT DELHI</text>
    <line x1="715" y1="488" x2="715" y2="535" stroke="#111111" stroke-width="2"/>
    <text class="mono" x="745" y="517" font-size="12.5" letter-spacing="1.5" fill="#111111">EX-McKINSEY</text>
    <line x1="925" y1="488" x2="925" y2="535" stroke="#111111" stroke-width="2"/>
    <text class="mono" x="955" y="517" font-size="12.5" letter-spacing="1.5" fill="#6f6b62">GEOSPATIAL ML</text>
  </g>
</svg>
