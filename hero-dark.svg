<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Jaskaran Singh — Deputy Director (Scientist-C) at the National Informatics Centre. I build and operate data.gov.in, India's national open government data platform, at NIC under MeitY. Part-time PhD at IIT Delhi.">
  <defs>
    <style>
      .mono { font-family: 'Courier New', 'DejaVu Sans Mono', monospace; }
      .sans { font-family: 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="430" fill="#0d1117"/>
  <!-- crimson top bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#ff4d6a"/>

  <!-- top rail -->
  <text class="mono" x="40" y="44" font-size="12.5" letter-spacing="1.4"><tspan fill="#ff4d6a" font-weight="bold">DEPUTY DIRECTOR · SCIENTIST-C</tspan><tspan fill="#8b949e">  /  NATIONAL INFORMATICS CENTRE</tspan></text>
  <text class="mono" x="1160" y="44" font-size="12.5" letter-spacing="1.4" fill="#8b949e" text-anchor="end">@sudo-karan</text>
  <line x1="40" y1="62" x2="1160" y2="62" stroke="#ededed" stroke-width="1.5"/>

  <!-- nameplate -->
  <text class="sans" x="36" y="192" font-size="114" font-weight="bold" letter-spacing="-3" fill="#ededed">Jaskaran</text>
  <text class="sans" x="36" y="300" font-size="114" font-weight="bold" letter-spacing="-3" fill="#ededed">Singh</text>

  <!-- right status column -->
  <text class="mono" x="1160" y="112" font-size="11" letter-spacing="2" fill="#8b949e" text-anchor="end">CURRENT STATUS</text>
  <text class="sans" x="1160" y="136" font-size="16" font-weight="bold" fill="#ededed" text-anchor="end">Deputy Director (Scientist-C)</text>
  <circle cx="936" cy="160" r="5" fill="#3fb950"/>
  <text class="mono" x="1160" y="164" font-size="11.5" letter-spacing="1.3" fill="#a0a7b0" text-anchor="end">OPEN TO DATA-PLATFORM WORK</text>
  <!-- JS monogram -->
  <rect x="1066" y="196" width="94" height="94" fill="none" stroke="#ff4d6a" stroke-width="3"/>
  <text class="sans" x="1113" y="261" font-size="42" font-weight="bold" fill="#ff4d6a" text-anchor="middle">JS</text>

