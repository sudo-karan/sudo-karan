    <tspan x="40" dy="0">I build and operate <tspan fill="#ff4d6a" font-weight="bold">data.gov.in</tspan>, India's national open</tspan>
    <tspan x="40" dy="25">government data platform, at NIC under MeitY.</tspan>
  </text>

  <!-- meta rail -->
  <line x1="40" y1="388" x2="1160" y2="388" stroke="#30363d" stroke-width="1"/>
  <text class="mono" x="40" y="410" font-size="12" letter-spacing="1.2" fill="#8b949e">NEW DELHI, IN · UTC+05:30       ·       PhD · IIT DELHI       ·       @sudo-karan</text>
